    <script>
      // Global suppression for unhandled cross-origin third-party script errors (e.g. Disqus in iframe)
      window.addEventListener('error', function(e) {
        if (e.message === 'Script error.' || (e.filename && e.filename.indexOf('disqus') !== -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.onerror = function(msg, url) {
        if (msg === 'Script error.' || (url && url.indexOf('disqus') !== -1)) {
          return true;
        }
      };
    </script>
